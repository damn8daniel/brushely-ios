name: Brushely

options:
  bundleIdPrefix: com.brushely
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false

targets:
  Brushely:
    type: application
    platform: iOS
    sources:
      - path: Brushely
    settings:
      base:
        INFOPLIST_FILE: Brushely/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.brushely.app
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Brushely/Info.plist
      properties:
        NSCameraUsageDescription: "Brushely использует камеру для анализа правильности чистки зубов в реальном времени."
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait"]
